<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro de Pessoa</title>
<style>
  body { font-family: Arial; margin: 40px; background: #f5f5f5; }
  .card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  h2 { text-align: center; }
  .form-row { display: flex; gap: 20px; margin-bottom: 10px; }
  .form-group { display: flex; flex-direction: column; flex: 1; }
  .form-group label { font-size: 13px; color: #555; margin-bottom: 4px; }
  .form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  .btn-row { display: flex; gap: 10px; margin-top: 10px; }
  button { padding: 8px 20px; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 14px; }
  .btn-incluir  { background: #28a745; }
  .btn-alterar  { background: #ffc107; color: #333; }
  .btn-excluir  { background: #dc3545; }
  .btn-consultar{ background: #17a2b8; }
  .btn-listar   { background: #007bff; float: right; }
  #mensagem { margin-top: 10px; font-size: 14px; color: green; }
  .lista-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table th { background: #222; color: white; padding: 10px; text-align: left; }
  table td { padding: 10px; border-bottom: 1px solid #eee; }
  table tr:hover { background: #f9f9f9; }
  h3 { margin: 0; }
</style>
</head>
<body>

<div class="card">
  <h2>Cadastro de Pessoa</h2>
  <div class="form-row">
    <div class="form-group">
      <label>CPF</label>
      <input type="text" id="cpf" maxlength="11">
    </div>
    <div class="form-group">
      <label>Nome</label>
      <input type="text" id="nome">
    </div>
  </div>
  <div class="btn-row">
    <button class="btn-incluir"   onclick="incluir()">Incluir</button>
    <button class="btn-alterar"   onclick="atualizar()">Alterar</button>
    <button class="btn-excluir"   onclick="excluir()">Excluir</button>
    <button class="btn-consultar" onclick="consultar()">Consultar</button>
  </div>
  <p id="mensagem"></p>
</div>

<div class="card">
  <div class="lista-header">
    <h3>Lista de Pessoas</h3>
    <button class="btn-listar" onclick="listar()">Atualizar Lista</button>
  </div>
  <table>
    <thead><tr><th>CPF</th><th>Nome</th></tr></thead>
    <tbody id="lista"></tbody>
  </table>
</div>

<script>
  const API = "/api/pessoas";

  async function incluir() {
    const pessoa = { cpf: document.getElementById("cpf").value, nome: document.getElementById("nome").value };
    const resp = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pessoa) });
    document.getElementById("mensagem").innerText = resp.ok ? "✔ Pessoa cadastrada! CPF: " + pessoa.cpf : "Erro ao cadastrar";
    listar();
  }

  async function atualizar() {
    const cpf = document.getElementById("cpf").value;
    const pessoa = { cpf, nome: document.getElementById("nome").value };
    const resp = await fetch(API + "/" + cpf, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(pessoa) });
    document.getElementById("mensagem").innerText = resp.ok ? "✔ Pessoa atualizada!" : "Erro ao atualizar";
    listar();
  }

  async function excluir() {
    const cpf = document.getElementById("cpf").value;
    const resp = await fetch(API + "/" + cpf, { method: "DELETE" });
    document.getElementById("mensagem").innerText = resp.ok ? "✔ Pessoa excluída!" : "Erro ao excluir";
    listar();
  }

  async function consultar() {
    const cpf = document.getElementById("cpf").value;
    const resp = await fetch(API + "/" + cpf);
    if (resp.ok) {
      const pessoa = await resp.json();
      if (pessoa) {
        document.getElementById("nome").value = pessoa.nome;
        document.getElementById("mensagem").innerText = "✔ Pessoa encontrada!";
      } else {
        document.getElementById("mensagem").innerText = "Pessoa não encontrada.";
      }
    } else {
      document.getElementById("mensagem").innerText = "Erro na consulta.";
    }
  }

  async function listar() {
    const resp = await fetch(API);
    const pessoas = await resp.json();
    const tbody = document.getElementById("lista");
    tbody.innerHTML = "";
    pessoas.forEach(p => {
      const tr = document.createElement("tr");
      tr.innerHTML = "<td>" + p.cpf + "</td><td>" + p.nome + "</td>";
      tbody.appendChild(tr);
    });
  }

  listar();
</script>
</body>
</html>
